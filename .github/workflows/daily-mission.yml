name: AETHER OS Daily Mission

on:
  schedule:
    # 14:00 UTC daily
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  daily-mission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Daily Mission Loop
        run: npx --yes tsx automation/scripts/daily-mission.ts

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(aether-os): daily mission brief'
          title: 'AETHER OS · Daily Mission Brief'
          body: |
            Auto-generated by **AETHER OS Daily Mission Loop**.

            - Review `aether-os/briefs/latest.md`
            - Open claimable issues as needed
            - Do not invent partners, contracts, or science results

            Architecture: `docs/AETHER_OS_Architecture_v1.md`
          branch: aether-os/daily-mission
          delete-branch: true
          labels: aether-os, automated
